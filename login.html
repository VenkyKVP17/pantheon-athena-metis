<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantheon Gateway</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0b0f19 0%, #111827 50%, #070a13 100%);
      --accent: #9059ff;
      --accent-glow: rgba(144, 89, 255, 0.4);
      --accent-bright: #3fe1b0;
      --panel-bg: rgba(17, 24, 39, 0.7);
      --panel-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Ambient background glows */
    body::before, body::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      filter: blur(150px);
      z-index: 0;
      opacity: 0.15;
      pointer-events: none;
    }

    body::before {
      background: var(--accent);
      top: 10%;
      left: 15%;
      animation: float-slow 15s infinite alternate;
    }

    body::after {
      background: var(--accent-bright);
      bottom: 10%;
      right: 15%;
      animation: float-slow 20s infinite alternate-reverse;
    }

    @keyframes float-slow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 40px) scale(1.1); }
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      z-index: 10;
    }

    .card {
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      text-align: center;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      border-color: rgba(144, 89, 255, 0.2);
      box-shadow: 0 20px 40px rgba(144, 89, 255, 0.05), 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .icon-container {
      position: relative;
      width: 96px;
      height: 96px;
      margin: 0 auto 32px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .icon-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px dashed rgba(144, 89, 255, 0.3);
      animation: spin-clockwise 30s linear infinite;
    }

    .icon-ring-inner {
      position: absolute;
      width: 80%;
      height: 80%;
      border-radius: 50%;
      border: 2px solid rgba(63, 225, 176, 0.2);
      animation: spin-counter 20s linear infinite;
    }

    @keyframes spin-clockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spin-counter {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    .shield-icon {
      width: 48px;
      height: 48px;
      color: var(--accent);
      filter: drop-shadow(0 0 12px var(--accent-glow));
      animation: pulse 3s infinite ease-in-out;
      z-index: 2;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px var(--accent-glow)); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 20px rgba(144, 89, 255, 0.6)); }
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 0%, #d1d5db 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      font-size: 15px;
      color: var(--text-muted);
      margin-bottom: 40px;
    }

    .btn {
      width: 100%;
      padding: 16px 24px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, var(--accent) 0%, #7c3aed 100%);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4), 0 0 24px rgba(144, 89, 255, 0.2);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .status-container {
      margin-top: 24px;
      min-height: 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .status-text {
      font-size: 14px;
      color: var(--text-muted);
      transition: color 0.3s ease;
    }

    .status-text.error {
      color: #ef4444;
    }

    .status-text.success {
      color: var(--accent-bright);
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent-bright);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 8px;
      display: none;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="icon-container">
        <div class="icon-ring"></div>
        <div class="icon-ring-inner"></div>
        <svg class="shield-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
        </svg>
      </div>

      <h1>Pantheon Gateway</h1>
      <p class="subtitle">Authenticate with your device passkey</p>

      <button id="login-btn" class="btn">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z" />
        </svg>
        Sign in with Passkey
      </button>

      <div class="status-container">
        <div id="status-spinner" class="spinner"></div>
        <div id="status-message" class="status-text">Ready</div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/@simplewebauthn/browser/dist/bundle/index.umd.min.js"></script>
  <script>
    const { startAuthentication } = SimpleWebAuthnBrowser;
    const loginBtn = document.getElementById('login-btn');
    const statusMsg = document.getElementById('status-message');
    const spinner = document.getElementById('status-spinner');

    function setStatus(text, type = '') {
      statusMsg.textContent = text;
      statusMsg.className = 'status-text ' + type;
      if (type === 'loading') {
        spinner.style.display = 'block';
      } else {
        spinner.style.display = 'none';
      }
    }

    async function handleLogin() {
      loginBtn.disabled = true;
      setStatus('Starting ceremony...', 'loading');

      try {
        // 1. Fetch authentication options from the backend
        const optionsRes = await fetch('/api/auth/webauthn/login-options', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });
        if (!optionsRes.ok) throw new Error('Failed to fetch ceremony options');
        const { options, challengeId } = await optionsRes.json();

        // 2. Perform authentication with the browser
        setStatus('Please verify via device credentials...', 'loading');
        const response = await startAuthentication(options);

        // 3. Verify authentication response on the server
        setStatus('Verifying credentials...', 'loading');
        const verifyRes = await fetch('/api/auth/webauthn/login-verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ challengeId, response })
        });

        if (!verifyRes.ok) {
          const errData = await verifyRes.json().catch(() => ({}));
          throw new Error(errData.statusMessage || errData.message || 'Verification failed');
        }

        setStatus('Access granted! Redirecting...', 'success');
        
        // 4. Redirect back to homepage
        setTimeout(() => {
          window.location.href = '/homepage.html';
        }, 800);

      } catch (err) {
        console.error(err);
        setStatus(err.message || 'Authentication failed', 'error');
        loginBtn.disabled = false;
      }
    }

    loginBtn.addEventListener('click', handleLogin);

    // Auto-initiate login on load
    window.addEventListener('load', () => {
      if (typeof window.PublicKeyCredential === 'undefined') {
        setStatus('WebAuthn is not supported on this browser.', 'error');
        loginBtn.disabled = true;
      } else {
        handleLogin();
      }
    });
  </script>
</body>
</html>
